<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16C26A" />
    <meta
      name="description"
      content="Интерактивный курс по криптотрейдингу на Bybit: с нуля до своей свинг-стратегии."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Трейдинг на Bybit с нуля</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        var theme = 'system';
        try {
          var saved = JSON.parse(localStorage.getItem('tc-settings') || '{}');
          if (saved && saved.state && saved.state.theme) theme = saved.state.theme;
        } catch (e) {}
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
