<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16C26A" />
    <meta
      name="description"
      content="Интерактивный курс по криптотрейдингу на Bybit: с нуля до своей свинг-стратегии."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bulleak — трейдинг на Bybit с нуля</title>
    <script>
      // Apply the saved theme and motion preference before first paint (mirrors
      // useApplyTheme / useApplyMotion) to avoid a light/dark flash or unwanted animation.
      (function () {
        var state = {};
        try {
          var saved = JSON.parse(localStorage.getItem('tc-settings') || '{}');
          if (saved && saved.state) state = saved.state;
        } catch (e) {}
        var theme = state.theme || 'system';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var motion = state.reducedMotion || 'system';
        var reduce =
          motion === 'off' ||
          (motion === 'system' && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.motion = reduce ? 'reduce' : 'full';
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static shell shown until the app mounts (React replaces it): paints the page
           before the JavaScript has loaded. -->
      <div class="flex min-h-dvh flex-col" aria-hidden="true">
        <div class="flex h-16 items-center border-b-2 border-border px-4">
          <img src="/favicon.svg" width="36" height="36" alt="" />
          <span class="ml-2.5 text-xl font-black tracking-[-0.035em]"
            ><span class="text-bull">Bull</span>eak</span
          >
        </div>
        <div class="mx-auto flex w-full max-w-5xl flex-col gap-4 px-4 pt-6">
          <div class="h-8 w-2/3 animate-pulse rounded-xl bg-surface-2"></div>
          <div class="h-40 animate-pulse rounded-3xl bg-surface-2"></div>
          <div class="h-24 animate-pulse rounded-3xl bg-surface-2"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
