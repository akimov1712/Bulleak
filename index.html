<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16C26A" />
    <meta
      name="description"
      content="Интерактивный курс по криптотрейдингу на Bybit: с нуля до своей свинг-стратегии."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Трейдинг на Bybit с нуля</title>
    <script>
      // Apply the saved theme and motion preference before first paint (mirrors
      // useApplyTheme / useApplyMotion) to avoid a light/dark flash or unwanted animation.
      (function () {
        var state = {};
        try {
          var saved = JSON.parse(localStorage.getItem('tc-settings') || '{}');
          if (saved && saved.state) state = saved.state;
        } catch (e) {}
        var theme = state.theme || 'system';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var motion = state.reducedMotion || 'system';
        var reduce =
          motion === 'off' ||
          (motion === 'system' && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.motion = reduce ? 'reduce' : 'full';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
